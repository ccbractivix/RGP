<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://amenities-web.onrender.com/api/status">
  <title>Pool Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    body {
      background: url('../static/images/HICV_PoolStatus.jpg') center center / cover no-repeat;
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(8, 23, 45, 0.75) 0%, rgba(8, 23, 45, 0.58) 42%, rgba(8, 23, 45, 0.28) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(18px, 3vw, 42px);
      gap: clamp(16px, 2.2vw, 40px);
    }

    .left-panel {
      width: min(58vw, 860px);
      min-width: 420px;
    }

    h1 {
      font-size: clamp(32px, 4.2vw, 68px);
      letter-spacing: 2px;
      margin-bottom: clamp(16px, 2vw, 26px);
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    #loading {
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 600;
      padding: 14px 0;
    }

    #amenity-list {
      list-style: none;
      display: grid;
      gap: clamp(9px, 1.2vw, 16px);
    }

    .amenity-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: clamp(10px, 1.3vw, 16px) clamp(12px, 1.5vw, 20px);
    }

    .badge {
      width: clamp(12px, 1.1vw, 17px);
      height: clamp(12px, 1.1vw, 17px);
      border-radius: 50%;
      margin-top: 2px;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
    }

    .badge.open { background: #24c55a; }
    .badge.closed { background: #d73b3e; }

    .amenity-name {
      font-size: clamp(22px, 2.2vw, 36px);
      font-weight: 700;
      line-height: 1.2;
      flex: 1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .amenity-hours {
      font-size: clamp(19px, 1.9vw, 31px);
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .amenity-hours.open { color: #67f17a; }
    .amenity-hours.closed { color: #ff7678; }

    .status-note {
      margin-top: clamp(10px, 1.2vw, 18px);
      font-size: clamp(14px, 1.2vw, 20px);
      color: #dce8f5;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .right-panel {
      width: min(26vw, 330px);
      min-width: 190px;
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.2vw, 16px);
      text-align: center;
      color: #f5f9ff;
    }

    .qr-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: clamp(9px, 1vw, 14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
    }

    .qr-card img {
      display: block;
      width: clamp(130px, 14vw, 250px);
      height: clamp(130px, 14vw, 250px);
    }

    .qr-text {
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    #updated {
      font-size: clamp(13px, 1vw, 17px);
      color: #d1e2f7;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    @media (max-width: 960px) {
      .overlay {
        flex-direction: column;
        align-items: stretch;
      }

      .left-panel,
      .right-panel {
        width: 100%;
        min-width: 0;
      }

      .right-panel {
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <section class="left-panel">
      <h1>Pool Status</h1>
      <div id="loading">Loading status…</div>
      <ul id="amenity-list" style="display:none;"></ul>
      <div class="status-note" id="status-note"></div>
    </section>

    <aside class="right-panel">
      <div class="qr-card">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&amp;data=https%3A%2F%2Fsites.google.com%2Fview%2Fholidayinnclubcape%2Fhome%2Finfo-director" alt="Info Director QR code">
      </div>
      <div>
        <div class="qr-text">Scan for the Info Director</div>
        <div id="updated"></div>
      </div>
    </aside>
  </div>

  <script>
  (function () {
    'use strict';

    var metaTag = document.querySelector('meta[name="api-url"]');
    var API_URL = (metaTag && metaTag.getAttribute('content')) || '/api/status';
    var REFRESH_MS = 60000;
    var PRIMARY_AMENITIES = [
      'Main Pool',
      'Main Spa',
      'Lazy River',
      'Water Slide',
      'Signature Pool',
      'Signature Spa'
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatTime12(t) {
      if (!t) return '';
      var parts = t.split(':');
      if (parts.length < 2) return '';
      var h = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      if (!Number.isFinite(h) || !Number.isFinite(m)) return '';
      if (h < 0 || h > 23 || m < 0 || m > 59) return '';
      var ampm = h >= 12 ? 'PM' : 'AM';
      if (h === 0) h = 12;
      else if (h > 12) h -= 12;
      if (m === 0) return h + ' ' + ampm;
      return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }

    function parseTimeToMinutes(timeStr) {
      if (!timeStr || typeof timeStr !== 'string') return null;
      var parts = timeStr.split(':');
      if (parts.length < 2) return null;
      var h = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
      if (h < 0 || h > 23 || m < 0 || m > 59) return null;
      return h * 60 + m;
    }

    function isWithinHours(now, openTime, closeTime) {
      var h = now.getHours();
      var m = now.getMinutes();
      var current = h * 60 + m;
      var open = parseTimeToMinutes(openTime);
      var close = parseTimeToMinutes(closeTime);
      if (open === null || close === null) return false;
      return current >= open && current < close;
    }

    function getStatusClass(amenity, now) {
      var withinHours = isWithinHours(now, amenity.openTime, amenity.closeTime);
      var isOpen = amenity.status !== 'closed' && withinHours;
      return isOpen ? 'open' : 'closed';
    }

    function render(data) {
      var amenities = (data && data.amenities) || [];
      var now = new Date(data.serverTime || Date.now());
      var loading = document.getElementById('loading');
      var list = document.getElementById('amenity-list');
      var statusNote = document.getElementById('status-note');

      var visibleAmenities = PRIMARY_AMENITIES
        .map(function (name) {
          return amenities.find(function (a) { return a.name === name; });
        })
        .filter(Boolean);

      if (visibleAmenities.length === 0) {
        loading.textContent = 'No pool status data available.';
        loading.style.display = 'block';
        list.style.display = 'none';
        statusNote.textContent = '';
        return;
      }

      var html = '';
      visibleAmenities.forEach(function (a) {
        var statusClass = getStatusClass(a, now);
        html += '<li class="amenity-row">';
        html += '<span class="badge ' + statusClass + '"></span>';
        html += '<span class="amenity-name">' + escapeHtml(a.name) + '</span>';
        html += '<span class="amenity-hours ' + statusClass + '">' + escapeHtml(formatTime12(a.openTime)) + ' - ' + escapeHtml(formatTime12(a.closeTime)) + '</span>';
        html += '</li>';
      });

      list.innerHTML = html;
      loading.style.display = 'none';
      list.style.display = 'grid';

      var anyLightning = visibleAmenities.some(function (a) { return a.lightning; });
      statusNote.textContent = anyLightning ? '⚡ Weather closure currently affecting one or more amenities.' : '';

      document.getElementById('updated').textContent =
        'Updated ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
    }

    function fetchAndRender() {
      fetch(API_URL)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          render(data);
          setTimeout(fetchAndRender, REFRESH_MS);
        })
        .catch(function (err) {
          console.error('[pool-status] fetch failed:', err);
          var loading = document.getElementById('loading');
          loading.textContent = 'Unable to load pool status.';
          loading.style.display = 'block';
          document.getElementById('amenity-list').style.display = 'none';
          setTimeout(fetchAndRender, REFRESH_MS);
        });
    }

    document.addEventListener('DOMContentLoaded', fetchAndRender);
  })();
  </script>
</body>
</html>
