<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="https://go4launch-backend.onrender.com">
  <title>Go4Launch Launch Alert</title>
  <style>
    :root {
      color-scheme: only light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #EDEEE1;
      color: #101820;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5vh 2.5vw;
    }

    .slide {
      width: 100%;
      max-width: 1700px;
      min-height: 95vh;
      background: rgba(255, 255, 255, 0.72);
      border: 3px solid rgba(16, 24, 32, 0.13);
      border-radius: 24px;
      padding: 2.6vh 2.2vw;
      display: flex;
      flex-direction: column;
      gap: 2vh;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 2vw;
    }

    .top h1 {
      margin: 0;
      font-size: clamp(34px, 3.2vw, 62px);
      letter-spacing: 0.02em;
    }

    .side-logo {
      height: clamp(70px, 7vh, 125px);
      width: auto;
      object-fit: contain;
      align-self: center;
      margin-bottom: 0.2vh;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 1.3vw;
      min-height: 0;
    }

    .panel {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid rgba(16, 24, 32, 0.12);
      border-radius: 18px;
      padding: 2.6vh 1.8vw;
    }

    .main-panel {
      display: flex;
      flex-direction: column;
    }

    .label {
      font-size: clamp(18px, 1.3vw, 28px);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4A5A67;
      margin-bottom: 0.7vh;
      font-weight: 700;
    }

    .value {
      margin: 0 0 1.4vh 0;
      font-size: clamp(30px, 2.35vw, 52px);
      line-height: 1.12;
      font-weight: 800;
      color: #142836;
    }

    .subvalue {
      margin: 0 0 2.2vh 0;
      font-size: clamp(25px, 1.8vw, 40px);
      line-height: 1.2;
      font-weight: 650;
    }

    .datetime {
      font-size: clamp(24px, 1.9vw, 40px);
      font-weight: 800;
      margin: 0;
    }

    .countdown {
      margin-top: 1.8vh;
      padding: 1.2vh 1vw;
      border-radius: 14px;
      background: #1A3A4E;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 0.6vw;
      font-size: clamp(22px, 1.7vw, 34px);
      font-weight: 700;
    }

    .rocket-image-wrap {
      margin: 0.4vh 0 1.5vh 0;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(16, 24, 32, 0.15);
      background: #f7f7f2;
    }

    .rocket-image-wrap img {
      width: 100%;
      height: clamp(170px, 26vh, 330px);
      object-fit: cover;
      display: block;
    }

    .side {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.2vh;
    }

    .rtl-box img {
      width: 100%;
      max-height: 24vh;
      object-fit: contain;
      margin-bottom: 1vh;
    }

    .rtl-time {
      margin: 0;
      font-size: clamp(24px, 1.7vw, 34px);
      line-height: 1.25;
      font-weight: 700;
    }

    .qr {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1vw;
      align-items: center;
    }

    .qr img {
      width: clamp(100px, 11vw, 220px);
      height: auto;
      border-radius: 10px;
      border: 2px solid rgba(16, 24, 32, 0.14);
      background: #fff;
    }

    .qr p {
      margin: 0;
      font-size: clamp(20px, 1.25vw, 29px);
      line-height: 1.3;
      font-weight: 600;
    }

    .status {
      text-align: right;
      font-size: clamp(14px, 0.95vw, 20px);
      color: #3B4E5C;
      margin-top: auto;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="top">
      <h1>LAUNCH ALERT</h1>
    </div>

    <div class="main">
      <section class="panel main-panel">
        <div class="label">Rocket</div>
        <h2 id="rocketName" class="value">Loading…</h2>

        <div class="label">Mission</div>
        <p id="missionName" class="subvalue">Loading…</p>

        <div id="rocketImageWrap" class="rocket-image-wrap hidden">
          <img id="rocketImage" src="" alt="Rocket image">
        </div>

        <div class="label">Launch Date &amp; Time (ET)</div>
        <p id="launchDateTime" class="datetime">Loading…</p>

        <div id="countdownWrap" class="countdown hidden">
          <span>Countdown:</span>
          <span id="countdownValue">--:--:--</span>
        </div>
      </section>

      <aside class="side">
        <img class="side-logo" src="images/go4launch_main_t.png" alt="Go4Launch logo">

        <section id="rtlBox" class="panel rtl-box hidden">
          <img src="../theater-web/static/RTL.png" alt="Rocket Talk Live">
          <div class="label">Rocket Talk Live</div>
          <p id="rtlDateTime" class="rtl-time"></p>
        </section>

        <section class="panel qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&amp;data=https%3A%2F%2Fccbractivix.github.io%2FRGP%2Fgo4launch%2Findex.html" alt="QR Code to Go4Launch app">
          <p>Scan for the full launch schedule, timing updates, and resort launch-view details.</p>
        </section>
      </aside>
    </div>

    <div id="status" class="status">Waiting for launch data…</div>
  </div>

  <script>
    (function () {
      'use strict';

      var metaTag = document.querySelector('meta[name="api-base"]');
      var API_BASE = (metaTag && metaTag.getAttribute('content')) || '';
      var countdownTimer = null;

      function isCompleted(launch) {
        var id = launch && launch.status && launch.status.id;
        return id === 3 || id === 4 || id === 7;
      }

      function formatDateTimeET(dateStr) {
        var d = new Date(dateStr);
        var date = d.toLocaleDateString('en-US', {
          timeZone: 'America/New_York',
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
        var time = d.toLocaleTimeString('en-US', {
          timeZone: 'America/New_York',
          hour: 'numeric',
          minute: '2-digit'
        });
        return date + ' — ' + time;
      }

      function formatRTLDateTime(dateStr) {
        var d = new Date(dateStr);
        var formatted = formatDateTimeET(dateStr);
        var time = d.toLocaleTimeString('en-US', {
          timeZone: 'America/New_York',
          hour: 'numeric',
          minute: '2-digit'
        });
        if (time === '7:00 PM') {
          return formatted + ' — Movie Theater';
        }
        return formatted;
      }

      function getRocketImageSrc(rocketName) {
        var name = String(rocketName || '').toLowerCase();
        if (name.indexOf('falcon 9') !== -1) return '../static/images/falcon.jpg';
        if (name.indexOf('atlas') !== -1) return '../static/images/atlas.jpg';
        if (name.indexOf('vulcan') !== -1) return '../static/images/vulcan.jpg';
        return '';
      }

      function setRocketImage(rocketName) {
        var wrap = document.getElementById('rocketImageWrap');
        var img = document.getElementById('rocketImage');
        if (!wrap || !img) return;
        var src = getRocketImageSrc(rocketName);
        if (!src) {
          img.removeAttribute('src');
          wrap.classList.add('hidden');
          return;
        }
        img.src = src;
        img.alt = rocketName + ' image';
        wrap.classList.remove('hidden');
      }

      function findNextLaunch(launches) {
        var now = Date.now();
        var candidates = (launches || []).filter(function (launch) {
          if (!launch || !launch.net) return false;
          if (isCompleted(launch)) return false;
          return new Date(launch.net).getTime() > now;
        });
        if (!candidates.length) return null;
        candidates.sort(function (a, b) { return new Date(a.net) - new Date(b.net); });
        return candidates[0];
      }

      function findNextRTL(content) {
        var now = Date.now();
        var next = null;
        Object.keys(content || {}).forEach(function (key) {
          var entry = content[key];
          if (!entry || !entry.rtl_datetime) return;
          var ts = new Date(entry.rtl_datetime).getTime();
          if (isNaN(ts) || ts < now) return;
          if (!next || ts < next.ts) next = { ts: ts, datetime: entry.rtl_datetime };
        });
        return next;
      }

      function fetchJson(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
          return res.json();
        });
      }

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value == null ? '' : String(value);
      }

      function startCountdown(launchNet) {
        var wrap = document.getElementById('countdownWrap');
        var valueEl = document.getElementById('countdownValue');
        if (!wrap || !valueEl) return;

        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }

        var launchTs = new Date(launchNet).getTime();
        var now = Date.now();
        var diff = launchTs - now;
        if (diff <= 0 || diff > 24 * 60 * 60 * 1000) {
          wrap.classList.add('hidden');
          return;
        }

        wrap.classList.remove('hidden');

        function update() {
          var delta = launchTs - Date.now();
          if (delta <= 0) {
            valueEl.textContent = 'Liftoff!';
            clearInterval(countdownTimer);
            countdownTimer = null;
            return;
          }
          var hours = Math.floor(delta / 3600000);
          var mins = Math.floor((delta % 3600000) / 60000);
          var secs = Math.floor((delta % 60000) / 1000);
          valueEl.textContent =
            String(hours).padStart(2, '0') + ':' +
            String(mins).padStart(2, '0') + ':' +
            String(secs).padStart(2, '0');
        }

        update();
        countdownTimer = setInterval(update, 1000);
      }

      function render(launches, content) {
        var next = findNextLaunch(launches);
        if (!next) {
          setText('rocketName', 'No upcoming launch available');
          setText('missionName', 'Please check again soon.');
          setRocketImage('');
          setText('launchDateTime', '—');
          document.getElementById('countdownWrap').classList.add('hidden');
          document.getElementById('status').textContent = 'No upcoming launch data available.';
          return;
        }

        var rocketName = (next.rocket && next.rocket.configuration && next.rocket.configuration.full_name) || 'Unknown Rocket';
        var missionName = (next.mission && next.mission.name) || next.name || 'Unknown Mission';

        setText('rocketName', rocketName);
        setText('missionName', missionName);
        setRocketImage(rocketName);
        setText('launchDateTime', formatDateTimeET(next.net));
        startCountdown(next.net);

        var nextRTL = findNextRTL(content);
        var rtlBox = document.getElementById('rtlBox');
        if (nextRTL) {
          setText('rtlDateTime', formatRTLDateTime(nextRTL.datetime));
          rtlBox.classList.remove('hidden');
        } else {
          rtlBox.classList.add('hidden');
        }

        document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      Promise.all([
        fetchJson(API_BASE + '/api/launches'),
        fetchJson(API_BASE + '/api/content').catch(function () { return {}; })
      ])
      .then(function (results) {
        render(results[0] || [], results[1] || {});
      })
      .catch(function (err) {
        setText('rocketName', 'Launch data unavailable');
        setText('missionName', 'Please retry shortly.');
        setRocketImage('');
        setText('launchDateTime', '—');
        document.getElementById('countdownWrap').classList.add('hidden');
        document.getElementById('rtlBox').classList.add('hidden');
        document.getElementById('status').textContent = 'Error: ' + err.message;
      });
    })();
  </script>
</body>
</html>
