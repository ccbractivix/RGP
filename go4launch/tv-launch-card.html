<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-base" content="https://go4launch-backend.onrender.com">
  <title>go4launch TV Launch Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Montserrat', sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
    }

    /* Full-screen background image */
    .slide {
      position: relative;
      width: 100%; height: 100%;
    }
    .slide-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /*
     * Text overlay area:
     *   10.896" wide × 11.469" high
     *   positioned .972" from left, 2.844" from top
     *   At 72 DPI on 1920×1080 (26.667"×15"):
     *     left:   3.645%    top: 18.96%
     *     width: 40.86%     height: 76.46%
     */
    .info-overlay {
      position: absolute;
      left: 3.645%;
      top: 18.96%;
      width: 40.86%;
      height: 76.46%;
      display: flex;
      flex-direction: column;
      color: #1a1a1a;
      overflow: hidden;
    }

    /* Frosted white panel behind text for legibility with dark text */
    .info-panel {
      position: absolute;
      left: 2.5%;
      top: 17%;
      width: 42%;
      height: 79%;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
    }

    .row-label {
      font-size: clamp(20px, 1.7vw, 32px);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
      margin-bottom: 0.3vh;
      font-weight: 700;
    }

    .rocket-name {
      font-size: clamp(32px, 4vw, 80px);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 1.8vh;
    }

    .mission-name {
      font-size: clamp(26px, 2.6vw, 52px);
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 2vh;
      opacity: 0.9;
    }

    .datetime {
      display: flex;
      flex-direction: column;
      gap: 0.2vh;
      font-size: clamp(28px, 2.6vw, 52px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2vh;
    }

    .datetime-time {
      font-size: clamp(30px, 2.75vw, 54px);
    }

    .overnight-note {
      align-self: flex-start;
      margin: 0 0 2vh;
      padding: 0.7vh 1vw;
      border-radius: 999px;
      background: rgba(115, 190, 255, 0.18);
      border: 1px solid rgba(160, 215, 255, 0.5);
      box-shadow: 0 0 20px rgba(69, 161, 235, 0.22);
      color: #1d5f92;
      font-size: clamp(13px, 1vw, 20px);
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .countdown {
      display: none;
      margin-bottom: 2vh;
      padding: 0.8vh 1vw;
      border-radius: 8px;
      background: rgba(230, 57, 70, 0.85);
      color: #fff;
      font-size: clamp(30px, 2.8vw, 56px);
      font-weight: 800;
      text-align: center;
      align-self: flex-start;
    }
    .countdown.visible { display: block; }

    /* ── RTL bubble: red-tinted with glow icons ── */
    .rtl-section {
      display: none;
      margin-top: auto;
      padding: 1.2vh 1.2vw;
      border-radius: 10px;
      background: rgba(180, 30, 40, 0.82);
      color: #fff;
      text-align: center;
    }
    .rtl-section.visible { display: block; }

    .rtl-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6vw;
      margin-bottom: 0.4vh;
    }

    .rtl-icon {
      font-size: clamp(24px, 2vw, 40px);
      animation: police-glow 1.8s ease-in-out infinite;
    }

    @keyframes police-glow {
      0%, 100% { filter: brightness(1) drop-shadow(0 0 2px rgba(255,60,60,0.3)); }
      50%      { filter: brightness(1.4) drop-shadow(0 0 12px rgba(255,60,60,0.9)) drop-shadow(0 0 24px rgba(255,40,40,0.5)); }
    }

    .rtl-label {
      font-size: clamp(22px, 1.8vw, 36px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .rtl-datetime {
      font-size: clamp(20px, 1.6vw, 32px);
      font-weight: 700;
      line-height: 1.3;
    }

    /* ── Gallery CTA bubble: light blue tint ── */
    .cta-section {
      display: none;
      margin-top: auto;
      padding: 1.2vh 1.2vw;
      border-radius: 10px;
      background: rgba(135, 195, 235, 0.85);
      color: #1a1a1a;
      text-align: center;
    }
    .cta-section.visible { display: flex; align-items: center; justify-content: center; gap: 1.2vw; }

    .cta-text {
      font-size: clamp(18px, 1.5vw, 30px);
      font-weight: 700;
      line-height: 1.3;
    }
    .cta-text .cta-camera {
      font-size: clamp(24px, 2vw, 40px);
      display: block;
      margin-bottom: 0.3vh;
    }

    .cta-qr {
      width: clamp(60px, 7vw, 120px);
      height: clamp(60px, 7vw, 120px);
      border-radius: 6px;
      background: #fff;
      flex-shrink: 0;
    }
    .cta-qr canvas,
    .cta-qr img {
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }

    .state-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2vw;
      font-weight: 700;
      color: #fff;
      text-align: center;
      background: #1a1a2e;
    }
  </style>
</head>
<body>
  <div id="root" class="state-msg">Loading launch card…</div>

  <script>
    (function () {
      'use strict';

      var IMAGE_BASE = 'https://ccbractivix.github.io/RGP/go4launch/images/';
      var SLIDE_IMAGES = {
        falcon:   IMAGE_BASE + 'LAUNCH-ALERT-FALCON.jpg',
        starship: IMAGE_BASE + 'LAUNCH-ALERT-STARSHIP.jpg',
        sls:      IMAGE_BASE + 'LAUNCH-ALERT-SLS.jpg',
        atlas:    IMAGE_BASE + 'LAUNCH-ALERT-ATLAS.jpg',
        vulcan:   IMAGE_BASE + 'LAUNCH-ALERT-VULCAN.jpg',
        nova:     IMAGE_BASE + 'LAUNCH-ALERT-NOVA.jpg',
      };
      var FUZZY_KEYWORDS = Object.keys(SLIDE_IMAGES);
      var DEFAULT_SLIDE = SLIDE_IMAGES.falcon;
      var GUEST_PAGE_BASE = 'https://ccbractivix.github.io/RGP/go4launch/';
      var RTL_EXPIRED_MS = 60 * 60 * 1000; // 1 hour after RTL start

      var API_BASE = (document.querySelector('meta[name="api-base"]') || {}).content || '';
      var params = new URLSearchParams(window.location.search);
      var launchId = params.get('launchId');
      var root = document.getElementById('root');
      var countdownTimer = null;
      var refreshTimer = null;

      function escapeHtml(v) {
        return String(v == null ? '' : v)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function formatDateET(dateValue) {
        return new Date(dateValue).toLocaleDateString('en-US', {
          month: 'long', day: 'numeric', year: 'numeric',
          timeZone: 'America/New_York',
        });
      }

      function formatTimeET(dateValue) {
        return new Date(dateValue).toLocaleTimeString('en-US', {
          hour: 'numeric', minute: '2-digit', hour12: true,
          timeZone: 'America/New_York',
        }) + ' ET';
      }

      function formatRTLDateTimeET(dateValue) {
        return new Date(dateValue).toLocaleString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric',
          hour: 'numeric', minute: '2-digit', hour12: true,
          timeZone: 'America/New_York',
        }) + ' ET';
      }

      function getEasternHour(dateValue) {
        var parts = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          hour: 'numeric',
          hourCycle: 'h23'
        }).formatToParts(new Date(dateValue));
        for (var i = 0; i < parts.length; i++) {
          if (parts[i].type === 'hour') return parseInt(parts[i].value, 10);
        }
        return NaN;
      }

      function getEasternWeekday(dateValue) {
        return new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          weekday: 'long'
        }).format(new Date(dateValue));
      }

      function getOvernightLaunchLabel(dateValue) {
        var hour = getEasternHour(dateValue);
        if (!Number.isFinite(hour) || hour < 0 || hour > 5) return '';
        var launchDate = new Date(dateValue);
        var dayOf = getEasternWeekday(launchDate);
        var dayBefore = getEasternWeekday(launchDate.getTime() - 24 * 60 * 60 * 1000);
        return 'Launch is overnight ' + dayBefore + ' night / ' + dayOf + ' morning';
      }

      function requestJson(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) {
            var err = new Error('HTTP ' + r.status);
            err.status = r.status;
            err.url = url;
            throw err;
          }
          return r.json();
        });
      }

      /**
       * Fuzzy-match the rocket name to a LAUNCH-ALERT slide image.
       * Checks if any keyword (falcon, starship, sls, atlas, vulcan, nova)
       * appears as a substring in the rocket name (case-insensitive).
       */
      function matchSlideImage(rocketName) {
        var name = String(rocketName || '').toLowerCase();
        for (var i = 0; i < FUZZY_KEYWORDS.length; i++) {
          if (name.indexOf(FUZZY_KEYWORDS[i]) !== -1) {
            return SLIDE_IMAGES[FUZZY_KEYWORDS[i]];
          }
        }
        return DEFAULT_SLIDE;
      }

      /**
       * Minimal QR code generator (numeric-mode-only not needed; use byte mode).
       * Generates a QR code as a data-URL image using Canvas.
       * Uses a lightweight approach: encode URL into a QR matrix via the
       * external qrcode-generator micro-library loaded inline below.
       */
      function generateQRDataUrl(text, size) {
        /* Use the qrcodegen lib injected at bottom of file */
        if (typeof qrcodegen === 'undefined') return '';
        var qr = qrcodegen.QrCode.encodeText(text, qrcodegen.QrCode.Ecc.MEDIUM);
        var modules = qr.size;
        var scale = Math.floor(size / (modules + 8)); // quiet zone
        if (scale < 1) scale = 1;
        var canvasSize = (modules + 8) * scale;
        var canvas = document.createElement('canvas');
        canvas.width = canvasSize;
        canvas.height = canvasSize;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasSize, canvasSize);
        ctx.fillStyle = '#000000';
        for (var y = 0; y < modules; y++) {
          for (var x = 0; x < modules; x++) {
            if (qr.getModule(x, y)) {
              ctx.fillRect((x + 4) * scale, (y + 4) * scale, scale, scale);
            }
          }
        }
        return canvas.toDataURL('image/png');
      }

      function renderCard(launch, cms) {
        var netMs = new Date(launch.net).getTime();
        var now = Date.now();
        var hoursUntilLaunch = (netMs - now) / (60 * 60 * 1000);

        var rocketName = ((launch.rocket || {}).configuration || {}).full_name || launch.name || 'Launch';
        var mission = (launch.mission || {}).name || launch.name || 'Mission details to be announced';
        var bgImage = matchSlideImage(rocketName);

        /*
         * RTL bubble state machine:
         *   - rtlDatetime set → show red RTL bubble (from card init)
         *   - rtlDatetime + 1 hour past → switch to light-blue gallery CTA
         *   - no rtlDatetime → neither bubble shown
         */
        var rtlDatetime = cms.rtl_datetime || '';
        var rtlMs = rtlDatetime ? new Date(rtlDatetime).getTime() : 0;
        var hasRTL = !!rtlDatetime && Number.isFinite(rtlMs);
        var rtlExpired = hasRTL && (now >= rtlMs + RTL_EXPIRED_MS);
        var showRTL = hasRTL && !rtlExpired;
        var showCTA = hasRTL && rtlExpired;
        var overnightLabel = getOvernightLaunchLabel(launch.net);

        var signupUrl = GUEST_PAGE_BASE + '?launch=' + encodeURIComponent(launch.id) + '#saw-it';

        // Build bottom section HTML
        var bottomHtml = '';
        if (showRTL) {
          bottomHtml =
            '<div class="rtl-section visible">' +
              '<div class="rtl-header">' +
                '<span class="rtl-icon">🚨</span>' +
                '<span class="rtl-label">Rocket Talk LIVE!</span>' +
                '<span class="rtl-icon">🚨</span>' +
              '</div>' +
              '<div class="rtl-datetime">' + escapeHtml(formatRTLDateTimeET(rtlDatetime)) + '</div>' +
              '<div class="rtl-datetime">in the Movie Theater</div>' +
            '</div>';
        } else if (showCTA) {
          var qrSrc = generateQRDataUrl(signupUrl, 200);
          bottomHtml =
            '<div class="cta-section visible">' +
              '<div class="cta-text">' +
                '<span class="cta-camera">📸</span>' +
                'Get the photos!<br>Scan &amp; we\u2019ll email<br>you the gallery.' +
              '</div>' +
              (qrSrc
                ? '<div class="cta-qr"><img src="' + qrSrc + '" alt="Scan for launch photos"></div>'
                : '') +
            '</div>';
        }

        function normalizeArchivedLaunch(payload, fallbackId) {
          var launchData = payload && payload.launch_data;
          if (typeof launchData === 'string') {
            try { launchData = JSON.parse(launchData); } catch (_e) { launchData = null; }
          }
          if (!launchData || typeof launchData !== 'object') return null;
          if (!launchData.id) launchData.id = fallbackId;
          return launchData;
        }

        function fetchArchivedLaunchById(id) {
          return requestJson(API_BASE + '/api/archive/launch/' + encodeURIComponent(id))
            .then(function (row) { return normalizeArchivedLaunch(row, id); })
            .catch(function (err) {
              if (err && err.status === 404) return null;
              var wrapped = new Error('Archive launch lookup failed for ' + id + ': ' + (err && err.message ? err.message : String(err || 'no error details available')));
              wrapped.cause = err;
              throw wrapped;
            });
        }

        function fetchLaunchForCard(id) {
          return fetchLaunchById(id).then(function (launch) {
            return { launch: launch, source: 'live' };
          }).catch(function (liveErr) {
            console.warn('[go4launch-tv-card] Live launch lookup failed; trying archive:', id, liveErr && liveErr.message);
            return fetchArchivedLaunchById(id).then(function (archivedLaunch) {
              if (archivedLaunch) {
                console.warn('[go4launch-tv-card] Using archived launch payload for:', id);
                return { launch: archivedLaunch, source: 'archive' };
              }
              console.warn('[go4launch-tv-card] Launch ID unresolved in live + archive:', id);
              return { launch: null, source: 'missing' };
            }).catch(function (archiveErr) {
              console.warn('[go4launch-tv-card] Archive lookup failed for launch:', id, archiveErr && archiveErr.message);
              return { launch: null, source: 'error' };
            });
          });
        }

        function hasCmsFallbackData(cms) {
          return !!(cms && (
            cms.headline ||
            cms.rtl_datetime ||
            cms.viewing_guide ||
            cms.chris_says ||
            cms.trajectory
          ));
        }

        function renderUnavailableCard(cms, activeLaunchId, reason) {
          var now = Date.now();
          var rtlDatetime = cms && cms.rtl_datetime ? cms.rtl_datetime : '';
          var rtlMs = rtlDatetime ? new Date(rtlDatetime).getTime() : 0;
          var hasRTL = !!rtlDatetime && Number.isFinite(rtlMs);
          var rtlExpired = hasRTL && (now >= rtlMs + RTL_EXPIRED_MS);
          var showRTL = hasRTL && !rtlExpired;
          var showCTA = hasRTL && rtlExpired;
          var signupUrl = GUEST_PAGE_BASE + '?launch=' + encodeURIComponent(activeLaunchId || '') + '#saw-it';
          var headline = (cms && cms.headline) ? cms.headline : 'Launch information temporarily unavailable';
          var statusText = reason === 'missing'
            ? 'Launch data is no longer available for this mission.<br>Please check the app for current launches.'
            : 'Mission data is temporarily unavailable.<br>Please check back shortly.';
          var qrSrc = showCTA ? generateQRDataUrl(signupUrl, 200) : '';
          var bottomHtml = '';

          if (showRTL) {
            bottomHtml =
              '<div class="rtl-section visible">' +
                '<div class="rtl-header">' +
                  '<span class="rtl-icon">🚨</span>' +
                  '<span class="rtl-label">Rocket Talk LIVE!</span>' +
                  '<span class="rtl-icon">🚨</span>' +
                '</div>' +
                '<div class="rtl-datetime">' + escapeHtml(formatRTLDateTimeET(rtlDatetime)) + '</div>' +
                '<div class="rtl-datetime">in the Movie Theater</div>' +
              '</div>';
          } else if (showCTA) {
            bottomHtml =
              '<div class="cta-section visible">' +
                '<div class="cta-text">' +
                  '<span class="cta-camera">📸</span>' +
                  'Get the photos!<br>Scan &amp; we\u2019ll email<br>you the gallery.' +
                '</div>' +
                (qrSrc
                  ? '<div class="cta-qr"><img src="' + qrSrc + '" alt="Scan for launch photos"></div>'
                  : '') +
              '</div>';
          }

          root.className = '';
          root.innerHTML =
            '<div class="slide">' +
              '<img class="slide-bg" src="' + escapeHtml(DEFAULT_SLIDE) + '" alt="Launch alert background">' +
              '<div class="info-panel"></div>' +
              '<div class="info-overlay">' +
                '<div class="row-label">Launch Update</div>' +
                '<div class="rocket-name">' + escapeHtml(headline) + '</div>' +
                '<div class="row-label">Status</div>' +
                '<div class="mission-name">' + statusText + '</div>' +
                bottomHtml +
              '</div>' +
            '</div>';
        }

        root.className = '';
        root.innerHTML =
          '<div class="slide">' +
            '<img class="slide-bg" src="' + escapeHtml(bgImage) + '" alt="Launch alert background">' +
            '<div class="info-panel"></div>' +
            '<div class="info-overlay">' +
              '<div class="row-label">Rocket</div>' +
              '<div class="rocket-name">' + escapeHtml(rocketName) + '</div>' +
              '<div class="row-label">Mission</div>' +
              '<div class="mission-name">' + escapeHtml(mission) + '</div>' +
              '<div class="row-label">Launch Date &amp; Time</div>' +
              '<div class="datetime">' +
                '<div>' + escapeHtml(formatDateET(launch.net)) + '</div>' +
                '<div class="datetime-time">at ' + escapeHtml(formatTimeET(launch.net)) + '</div>' +
              '</div>' +
              (overnightLabel ? '<div class="overnight-note">' + escapeHtml(overnightLabel) + '</div>' : '') +
              '<div class="countdown" id="countdown"></div>' +
              bottomHtml +
            '</div>' +
          '</div>';

        // Countdown clock: show when launch is within 12 hours
        if (hoursUntilLaunch > 0 && hoursUntilLaunch <= 12) {
          startCountdown(netMs);
        }

        // Auto-refresh: every 60s when launch within 2 hours, or every 5 min
        // around RTL transition so bubble state updates without long delay
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        if (Math.abs(hoursUntilLaunch) <= 2) {
          refreshTimer = setInterval(function () { loadAndRender(); }, 60000);
        } else if (hasRTL) {
          // Refresh every 5 min so RTL→CTA transition is reasonably prompt
          refreshTimer = setInterval(function () { loadAndRender(); }, 300000);
        }
      }

      function startCountdown(launchMs) {
        var el = document.getElementById('countdown');
        if (!el) return;
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

        el.classList.add('visible');

        function tick() {
          var delta = launchMs - Date.now();
          if (delta <= 0) {
            el.textContent = 'LIFTOFF!';
            clearInterval(countdownTimer);
            countdownTimer = null;
            return;
          }
          var h = Math.floor(delta / 3600000);
          var m = Math.floor((delta % 3600000) / 60000);
          var s = Math.floor((delta % 60000) / 1000);
          el.textContent = 'T-' +
            String(h).padStart(2, '0') + ':' +
            String(m).padStart(2, '0') + ':' +
            String(s).padStart(2, '0');
        }

        tick();
        countdownTimer = setInterval(tick, 1000);
      }

      function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      function fetchLaunchById(id, attempt) {
        attempt = attempt || 1;
        return requestJson(API_BASE + '/api/launches/' + encodeURIComponent(id))
          .catch(function (err) {
            if (attempt < 3) {
              return delay(2000 * attempt).then(function () {
                return fetchLaunchById(id, attempt + 1);
              });
            }
            throw err;
          });
      }

      function loadAndRender() {
        return Promise.all([
          fetchLaunchForCard(launchId),
          requestJson(API_BASE + '/api/content/' + encodeURIComponent(launchId)).catch(function () { return null; }),
        ]).then(function (results) {
          var launchLookup = results[0] || {};
          var launch = launchLookup.launch;
          var cms = results[1] || {};
          if (launch && launch.id) {
            renderCard(launch, cms);
            return;
          }
          if (hasCmsFallbackData(cms)) {
            console.warn('[go4launch-tv-card] Rendering fallback card from CMS-only content for unresolved launch:', launchId);
            renderUnavailableCard(cms, launchId, launchLookup.source);
            return;
          }
          if (launchLookup.source === 'missing') {
            root.className = 'state-msg';
            root.textContent = 'Launch card unavailable (launch not found).';
            return;
          }
          if (launchLookup.source === 'error') {
            root.className = 'state-msg';
            root.textContent = 'Launch card unavailable (data error).';
            return;
          }
          root.className = 'state-msg';
          root.textContent = 'Launch card unavailable (unknown state).';
        }).catch(function () {
          root.className = 'state-msg';
          root.textContent = 'Launch card unavailable (data error).';
        });
      }

      if (!launchId) {
        root.className = 'state-msg';
        root.textContent = 'Launch card unavailable (missing launchId).';
        return;
      }

      loadAndRender();
    })();
  </script>

  <!--
    Nayuki QR Code generator library (MIT license)
    https://github.com/nayuki/QR-Code-generator
    Minified inline to avoid external dependency for TV displays.
