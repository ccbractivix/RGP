<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://cabana-backend.onrender.com">
  <title>Cabana Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    #slide {
      width: 100%; height: 100%;
      position: relative;
    }

    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /*
     * Text placement derived from the 1920×1080 @ 72 DPI design:
     *   X:  14.707" → 55.15%   to   26.155" → 98.08%   (width ≈ 42.93%)
     *   Y:  12.805" → 85.36%   (original 11.555" + 1.25" = 12.805")
     * Font size increased 25% from original (clamp 28/3.5vw/64 → 35/4.375vw/80).
     */
    #name-text {
      position: absolute;
      left: 55.15%;
      width: 42.93%;
      top: 85.36%;
      transform: translateY(-50%);
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(35px, 4.375vw, 80px);
      color: #fff;
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      display: none;
    }
  </style>
</head>
<body>
<div id="slide">
  <img id="bg-image" alt="">
  <div id="name-text"></div>
</div>

<script>
(function () {
  'use strict';

  const IMAGES_BASE = 'https://ccbractivix.github.io/RGP/static/images/';
  const API_BASE    = (document.querySelector('meta[name="api-url"]')?.content || '').replace(/\/$/, '');

  const params   = new URLSearchParams(window.location.search);
  const cabanaNo = Math.max(1, parseInt(params.get('cabana') || '1', 10));

  const bgImage  = document.getElementById('bg-image');
  const nameText = document.getElementById('name-text');

  // Shrink font size until the text element fits within the slide boundaries.
  function fitText() {
    const slide = document.getElementById('slide');
    const slideRect = slide.getBoundingClientRect();
    let rect = nameText.getBoundingClientRect();
    let size = parseFloat(window.getComputedStyle(nameText).fontSize);
    while (
      (rect.bottom > slideRect.bottom || rect.top < slideRect.top ||
       rect.right > slideRect.right  || rect.left < slideRect.left) &&
      size > 10
    ) {
      size -= 1;
      nameText.style.fontSize = size + 'px';
      rect = nameText.getBoundingClientRect();
    }
  }

  async function update() {
    try {
      const res  = await fetch(`${API_BASE}/api/cabana-slide?cabana=${cabanaNo}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.last_name) {
        bgImage.src            = IMAGES_BASE + 'HICV_YOUR_CABANA.jpg';
        nameText.textContent   = `The ${data.last_name} Family`;
        nameText.style.fontSize = '';   // reset to CSS clamp default
        nameText.style.display = 'block';
        fitText();
      } else {
        bgImage.src            = IMAGES_BASE + 'HICV_AVAILABLE_CABANA.jpg';
        nameText.style.display = 'none';
      }
    } catch (e) {
      console.error('[cabana-slide] fetch error:', e);
    }
  }

  update();
  // Refresh every 5 minutes so same-day booking changes are reflected quickly
  setInterval(update, 5 * 60 * 1000);
})();
</script>
</body>
</html>
