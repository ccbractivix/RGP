<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://cabana-backend.onrender.com">
  <title>Cabana Daily Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a; --card: #1e293b; --card-border: #334155;
      --text: #e2e8f0; --text-muted: #94a3b8;
      --green: #22c55e; --green-dim: rgba(34,197,94,0.15);
      --red: #ef4444; --red-dim: rgba(239,68,68,0.15);
      --yellow: #eab308; --yellow-dim: rgba(234,179,8,0.15);
      --orange: #f59e0b; --orange-dim: rgba(245,158,11,0.15);
      --blue: #3b82f6; --blue-dim: rgba(59,130,246,0.15);
      --purple: #a855f7; --purple-dim: rgba(168,85,247,0.15);
    }

    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }

    /* ── Login Screen ── */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    #login-screen h1 { font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    #login-screen p { color: var(--text-muted); margin-bottom: 24px; font-size: 13px; }
    .code-input { width: 200px; padding: 14px; font-size: 24px; font-family: 'Inter', sans-serif; text-align: center; letter-spacing: 8px; background: var(--card); color: var(--text); border: 2px solid var(--card-border); border-radius: 10px; outline: none; }
    .code-input:focus { border-color: var(--blue); }
    .login-btn { margin-top: 16px; padding: 12px 40px; font-size: 15px; font-weight: 600; background: var(--blue); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .login-btn:active { opacity: 0.8; }
    .login-error { color: var(--red); margin-top: 12px; font-size: 13px; min-height: 20px; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    #dashboard.show { display: block; }

    .dashboard-header { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .dashboard-header h1 { font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; }
    .logout-btn { font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--card-border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    .logout-btn:active { background: var(--card-border); }

    /* ── Date Navigation ── */
    .date-nav { display: flex; align-items: center; justify-content: center; gap: 16px; background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .nav-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
    .nav-btn:hover { border-color: var(--blue); }
    .nav-btn:active { background: var(--card-border); }
    .date-display { font-size: 18px; font-weight: 700; min-width: 200px; text-align: center; }

    /* ── Cabanas Grid ── */
    .cabanas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    
    .cabana-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; }
    .cabana-card.booked { border-color: var(--red); background: rgba(239, 68, 68, 0.05); }
    .cabana-card.unavailable { border-color: var(--orange); background: rgba(245, 158, 11, 0.05); }
    
    .cabana-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cabana-name { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 700; }
    .cabana-status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .cabana-status.available { background: var(--green-dim); color: var(--green); }
    .cabana-status.booked-paid { background: var(--red-dim); color: var(--red); }
    .cabana-status.booked-unpaid { background: var(--yellow-dim); color: var(--yellow); }
    .cabana-status.booked-comped { background: var(--blue-dim); color: var(--blue); }
    .cabana-status.hold { background: var(--orange-dim); color: var(--orange); }

    .cabana-content { min-height: 60px; }
    .guest-info { margin-bottom: 10px; }
    .guest-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .guest-phone { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .guest-slots { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .slot-badge { display: inline-block; padding: 3px 8px; background: var(--blue-dim); color: var(--blue); border-radius: 4px; font-size: 11px; font-weight: 600; }
    .status-text { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

    /* ── No Rentals ── */
    .no-rentals { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--card-border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .dashboard-header { flex-direction: column; align-items: flex-start; }
      .date-nav { flex-direction: column; }
      .date-display { min-width: auto; }
      .cabanas-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen">
    <h1>Cabana Dashboard</h1>
    <p>Enter your operator code to continue</p>
    <input type="password" id="code-input" class="code-input" placeholder="••••••" maxlength="6">
    <button class="login-btn" onclick="handleLogin()">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="dashboard-header">
      <h1>Cabana Daily Dashboard</h1>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <div class="date-nav">
      <button class="nav-btn" onclick="previousDay()">← Previous</button>
      <div class="date-display" id="date-display"></div>
      <button class="nav-btn" onclick="nextDay()">Next →</button>
    </div>

    <div id="cabanas-container">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 12px;">Loading rentals...</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = document.querySelector('meta[name="api-url"]').content;
    let authCode = null;
    let currentDate = new Date();

    // ── Date Formatting ──
    function toDateString(date) {
      return date.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
    }

    function toDisplayDate(date) {
      const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'America/New_York' };
      return date.toLocaleDateString('en-US', options);
    }

    function getTodayEastern() {
      const now = new Date();
      const easternDate = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
      easternDate.setHours(0, 0, 0, 0);
      return easternDate;
    }

    // ── Authentication ──
    async function handleLogin() {
      const code = document.getElementById('code-input').value.trim();
      if (!code) {
        showLoginError('Please enter a code');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/operator/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        const data = await response.json();
        if (data.valid) {
          authCode = code;
          showDashboard();
          currentDate = getTodayEastern();
          updateDashboard();
        } else {
          showLoginError('Invalid code');
        }
      } catch (e) {
        console.error('Login error:', e);
        showLoginError('Connection error. Please try again.');
      }
    }

    function handleLogout() {
      authCode = null;
      document.getElementById('code-input').value = '';
      showLoginScreen();
    }

    function showLoginError(msg) {
      document.getElementById('login-error').textContent = msg;
    }

    function showLoginScreen() {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').classList.remove('show');
    }

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').classList.add('show');
    }

    // ── Date Navigation ──
    function previousDay() {
      currentDate.setDate(currentDate.getDate() - 1);
      updateDashboard();
    }

    function nextDay() {
      currentDate.setDate(currentDate.getDate() + 1);
      updateDashboard();
    }

    function updateDateDisplay() {
      document.getElementById('date-display').textContent = toDisplayDate(currentDate);
    }

    // ── Fetch and Display ──
    async function updateDashboard() {
      updateDateDisplay();

      // Fetch data for the selected date (we could fetch a range, but for simplicity, just the day)
      const dateStr = toDateString(currentDate);
      try {
        const response = await fetch(
          `${API_BASE_URL}/operator/calendar?start=${dateStr}&end=${dateStr}`,
          { headers: { 'x-auth-code': authCode } }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        renderCabanas(data.bookings, data.blocks);
      } catch (e) {
        console.error('Error fetching bookings:', e);
        document.getElementById('cabanas-container').innerHTML = '<div class="no-rentals">Error loading data. Please try again.</div>';
      }
    }

    async function renderCabanas(bookings, blocks) {
      // Fetch cabanas list
      let cabanas = [];
      try {
        const response = await fetch(`${API_BASE_URL}/operator/cabanas`, {
          headers: { 'x-auth-code': authCode }
        });
        const data = await response.json();
        cabanas = data.cabanas;
      } catch (e) {
        console.error('Error fetching cabanas:', e);
      }

      if (cabanas.length === 0) {
        document.getElementById('cabanas-container').innerHTML = '<div class="no-rentals">No cabanas configured.</div>';
        return;
      }

      const dateStr = toDateString(currentDate);
      const html = cabanas.map(cabana => {
        // Find bookings for this cabana on this date
        const cabanaBookings = bookings.filter(b => b.cabana_id === cabana.id && b.booking_date === dateStr);
        
        // Find holds/blocks for this cabana on this date
        const cabanaBlocks = blocks.filter(b => 
          b.cabana_id === cabana.id && 
          b.start_date <= dateStr && 
          (!b.end_date || b.end_date >= dateStr)
        );

        let statusClass = 'available';
        let statusText = 'Available';
        let content = '';

        if (cabanaBlocks.length > 0) {
          statusClass = 'hold';
          statusText = 'Hold';
          const block = cabanaBlocks[0];
          content = `<div class="status-text">${block.hold_type || 'Hold'}</div>`;
        } else if (cabanaBookings.length > 0) {
          const booking = cabanaBookings[0];
          const statusMap = {
            'paid': 'booked-paid',
            'unpaid': 'booked-unpaid',
            'comped': 'booked-comped',
            'tentative': 'booked-unpaid'
          };
          statusClass = statusMap[booking.status] || 'booked-unpaid';
          statusText = booking.status.charAt(0).toUpperCase() + booking.status.slice(1);

          const slots = [];
          if (booking.slot === 'full-day') slots.push('Full Day');
          else if (booking.slot === 'morning') slots.push('Morning');
          else if (booking.slot === 'afternoon') slots.push('Afternoon');

          content = `
            <div class="guest-info">
              <div class="guest-name">${booking.first_name} ${booking.last_name}</div>
              ${booking.guest_phone ? `<div class="guest-phone">${booking.guest_phone}</div>` : ''}
              <div class="guest-slots">${slots.map(s => `<span class="slot-badge">${s}</span>`).join('')}</div>
            </div>
            <div class="status-text">${statusText}</div>
          `;
        }

        return `
          <div class="cabana-card ${statusClass === 'available' ? '' : statusClass === 'hold' ? 'unavailable' : 'booked'}">
            <div class="cabana-header">
              <div class="cabana-name">${cabana.name}</div>
              <div class="cabana-status ${statusClass}">${statusText}</div>
            </div>
            <div class="cabana-content">
              ${content}
            </div>
          </div>
        `;
      }).join('');

      const noRentals = bookings.filter(b => b.booking_date === dateStr).length === 0 && blocks.filter(b => 
        b.start_date <= dateStr && (!b.end_date || b.end_date >= dateStr)
      ).length === 0;

      document.getElementById('cabanas-container').innerHTML = html || (noRentals ? '<div class="no-rentals">No rentals or holds for this day.</div>' : '');
    }

    // ── Initialize ──
    window.onload = function() {
      showLoginScreen();
      document.getElementById('code-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
      });
    };
  </script>
</body>
</html>
