<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="">
  <title>Magic Show | Check-in</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="../shared/rooms.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-mode="check-in">
  <header><div><p class="eyebrow">GUEST EXPERIENCES</p><h1>Magic show check-in</h1><p>Thursdays &middot; 7 pm Eastern &middot; General admission</p></div><a href="index.html">Reservations desk</a></header>
  <main>
    <section class="show-bar" aria-label="Show selection">
      <label for="show-date">Thursday show date<input type="date" id="show-date" required></label>
      <p id="show-label"></p><span id="sync-status" role="status">Connecting...</span>
    </section>
    <section id="scoreboard" class="scoreboard" aria-label="Seating scoreboard" aria-live="polite"></section>
    <p id="message" role="alert" hidden></p>
    <section class="panel list-panel">
      <div class="list-heading"><h2>Reservations <span id="reservation-count"></span></h2><button id="refresh" type="button">Refresh</button></div>
      <div class="filters"><label for="search">Search name or room<input id="search" type="search" placeholder="Last name or room number"></label><button id="filter-room" type="button">Select room</button><button id="clear-filter" type="button" hidden>Clear room</button></div>
      <p>Sorted by last name. Check in only the guests who have arrived.</p>
      <div id="reservation-list"></div>
    </section>
  </main>
</body>
</html>
