<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://channel-backend-uu2s.onrender.com">
  <title>Channel Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Iframe container ─────────────────────────────────────────────────── */
    .frame-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transition: opacity 1.8s ease-in-out;
    }
    .frame-container iframe {
      width: 100%; height: 100%;
      border: none;
      background: #000;
    }
    .frame-container.hidden { opacity: 0; pointer-events: none; }
    .frame-container.visible { opacity: 1; }

    /* ── Breakthrough overlay ─────────────────────────────────────────────── */
    #breakthrough-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px;
    }
    #breakthrough-overlay.active { display: flex; }
    #bt-title {
      font-size: clamp(36px, 5vw, 72px);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    #bt-message {
      font-size: clamp(22px, 3vw, 48px);
      font-weight: 500;
      line-height: 1.5;
      max-width: 80%;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }
    #bt-pulse {
      position: absolute;
      top: 24px; right: 32px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Lightning banner ─────────────────────────────────────────────────── */
    #lightning-banner {
      display: none;
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      z-index: 900;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #000;
      padding: 14px 32px;
      font-size: clamp(16px, 2vw, 28px);
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 -4px 20px rgba(245,158,11,0.4);
    }
    #lightning-banner.active { display: block; }
    #lightning-banner .bolt { margin: 0 12px; }

    /* ── Loading / error state ────────────────────────────────────────────── */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      color: #666;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      font-size: 18px;
    }
    #loading-screen .spinner {
      width: 40px; height: 40px;
      border: 4px solid #333;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen.hidden { display: none; }

    /* ── Status indicator (bottom-right) ──────────────────────────────────── */
    #status-dot {
      position: fixed;
      bottom: 8px; right: 12px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      z-index: 800;
      opacity: 0.5;
    }
    #status-dot.error { background: #ef4444; }
  </style>
</head>
<body>

  <!-- Loading screen (shown until first slide loads) -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Loading channel…</div>
  </div>

  <!-- Two alternating iframe containers for crossfade -->
  <div id="frame-a" class="frame-container visible"></div>
  <div id="frame-b" class="frame-container hidden"></div>

  <!-- Breakthrough overlay -->
  <div id="breakthrough-overlay">
    <div id="bt-pulse"></div>
    <div id="bt-title"></div>
    <div id="bt-message"></div>
    <iframe id="bt-slide" style="display:none; position:absolute; inset:0; width:100%; height:100%; border:none; z-index:1;"></iframe>
  </div>

  <!-- Lightning banner -->
  <div id="lightning-banner">
    <span class="bolt">⚡</span>
    WEATHER CLOSURE IN EFFECT — WATER AMENITIES TEMPORARILY CLOSED
    <span class="bolt">⚡</span>
  </div>

  <!-- Status indicator -->
  <div id="status-dot"></div>

<script>
(function() {
  'use strict';

  /* ── Configuration ─────────────────────────────────────────────────────── */
  const API_BASE      = document.querySelector('meta[name="api-url"]')?.content || '';
  const ALERT_POLL_MS = 15_000;   // Check for breakthroughs every 15s
  const HEARTBEAT_MS  = 60_000;   // Send heartbeat every 60s
  const CONFIG_POLL_MS = 300_000; // Re-fetch channel config every 5 min
  const PRELOAD_SEC   = 12;       // Pre-load next iframe this many seconds before transition
  const PRELOAD_TIMEOUT_MS = 12_000; // Max time to wait for a slide iframe load event
  const READY_WAIT_MS = 6_000;       // Max extra wait at transition time for pending slide readiness
  const READY_POLL_MS = 250;         // Poll cadence while waiting for readiness
  const TIMED_RULE_POLL_MS = 15_000; // Re-evaluate timer windows every 15s
  const FORCED_CELEBRATION_MS = 30_000;
  const CACHE_KEY     = 'channel_player_cache';

  /* ── State ─────────────────────────────────────────────────────────────── */
  const params    = new URLSearchParams(window.location.search);
  const channelId = params.get('channel') || 'building-1';
  let slides      = [];
  let baseSlides  = [];
  let channelRules = {};
  let currentIdx  = 0;
  let rotationTimer = null;
  let preloadTimer  = null;
  let readinessTimer = null;
  let forcedTimer = null;
  let breakthroughActive = false;
  let pendingNextIdx = null;
  let pendingReady = false;
  let pendingToken = 0;
  let forcedCelebrationActive = false;
  let forcedCelebrationQueue = [];
  let lastForcedCelebrationSlot = '';

  /* ── DOM refs ──────────────────────────────────────────────────────────── */
  const frameA   = document.getElementById('frame-a');
  const frameB   = document.getElementById('frame-b');
  const loading  = document.getElementById('loading-screen');
  const loadText = document.getElementById('loading-text');
  const btOverlay = document.getElementById('breakthrough-overlay');
  const btTitle   = document.getElementById('bt-title');
  const btMessage = document.getElementById('bt-message');
  const ltBanner  = document.getElementById('lightning-banner');
  const statusDot = document.getElementById('status-dot');

  let activeFrame  = frameA;
  let pendingFrame = frameB;

  /* ── Helpers ───────────────────────────────────────────────────────────── */
  function setTitle(name) {
    document.title = name ? `${name} — Channel Player` : 'Channel Player';
  }

  function createIframe(url) {
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.setAttribute('loading', 'eager');
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups');
    return iframe;
  }

  function clearFrame(container) {
    while (container.firstChild) container.removeChild(container.firstChild);
  }

  function parseClockToMinutes(value, fallback) {
    const text = String(value || '').trim();
    if (!/^\d{1,2}:\d{2}$/.test(text)) return fallback;
    const [h, m] = text.split(':').map(Number);
    if (!Number.isFinite(h) || !Number.isFinite(m) || h < 0 || h > 23 || m < 0 || m > 59) return fallback;
    return h * 60 + m;
  }

  function isWithinForcedExpressWindow(now) {
    const rule = channelRules.forced_express_checkout;
    if (!rule || !rule.enabled) return false;
    const startMin = parseClockToMinutes(rule.config && rule.config.start, 7 * 60);
    const endMin = parseClockToMinutes(rule.config && rule.config.end, 10 * 60 + 30);
    const mins = now.getHours() * 60 + now.getMinutes();
    return mins >= startMin && mins <= endMin;
  }

  function isExpressCheckoutSlide(slide) {
    const text = `${slide.label || ''} ${slide.url || ''}`.toLowerCase();
    return text.includes('express checkout') || text.includes('checkout-slide.html');
  }

  function isAmenitiesStatusSlide(slide) {
    const text = `${slide.label || ''} ${slide.url || ''}`.toLowerCase();
    return text.includes('amenities status') || text.includes('amenity status') || text.includes('/amenities-web/tv.html');
  }

  function isBuildingChannel() {
    return /^building-[123]$/.test(channelId);
  }

  function isCelebrationSlide(slide) {
    return String(slide.url || '').includes('/celebrations-web/slide.html');
  }

  function getEffectiveSlides(now = new Date()) {
    const source = Array.isArray(baseSlides) ? baseSlides : [];
    if (source.length === 0) return [];
    if (!isWithinForcedExpressWindow(now)) return source;
    const filtered = source.filter(s => isExpressCheckoutSlide(s) || isAmenitiesStatusSlide(s));
    return filtered.length > 0 ? filtered : source;
  }

  function maybeApplyTimedSlides() {
    if (!Array.isArray(baseSlides) || baseSlides.length === 0) return;
    const nextSlides = getEffectiveSlides(new Date());
    const oldJson = JSON.stringify(slides);
    const newJson = JSON.stringify(nextSlides);
    if (oldJson === newJson) return;
    slides = nextSlides;
    currentIdx = 0;
    pendingNextIdx = null;
    pendingReady = false;
    if (rotationTimer) clearTimeout(rotationTimer);
    if (preloadTimer) clearTimeout(preloadTimer);
    if (readinessTimer) clearTimeout(readinessTimer);
    if (forcedCelebrationActive || slides.length === 0) return;
    loadSlide(activeFrame, slides[0].url).then(() => {
      activeFrame.classList.add('visible');
      activeFrame.classList.remove('hidden');
      loading.classList.add('hidden');
      if (slides.length > 1) scheduleNext();
    });
  }

  function getCurrentHalfHourSlot(now = new Date()) {
    const m = now.getMinutes();
    let slotMinute = null;
    if (m < 1) slotMinute = 0;
    else if (m >= 30 && m < 31) slotMinute = 30;
    else return '';
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hour = String(now.getHours()).padStart(2, '0');
    const minute = String(slotMinute).padStart(2, '0');
    return `${now.getFullYear()}-${month}-${day}-${hour}-${minute}`;
  }

  function clearRotationTimers() {
    if (rotationTimer) clearTimeout(rotationTimer);
    if (preloadTimer) clearTimeout(preloadTimer);
    if (readinessTimer) clearTimeout(readinessTimer);
    rotationTimer = null;
    preloadTimer = null;
    readinessTimer = null;
  }

  async function playForcedCelebrationQueue() {
    if (forcedCelebrationQueue.length === 0) return;
    const item = forcedCelebrationQueue.shift();
    await loadSlide(activeFrame, item.url);
    activeFrame.classList.add('visible');
    activeFrame.classList.remove('hidden');
    pendingFrame.classList.remove('visible');
    pendingFrame.classList.add('hidden');
    forcedTimer = setTimeout(async () => {
      if (forcedCelebrationQueue.length === 0) {
        forcedCelebrationActive = false;
        forcedTimer = null;
        if (!slides[currentIdx]) return;
        await loadSlide(activeFrame, slides[currentIdx].url);
        if (slides.length > 1) scheduleNext();
        return;
      }
      await playForcedCelebrationQueue();
    }, FORCED_CELEBRATION_MS);
  }

  function maybeRunForcedCelebrations() {
    if (breakthroughActive || forcedCelebrationActive || !isBuildingChannel()) return;
    const slot = getCurrentHalfHourSlot(new Date());
    if (!slot || slot === lastForcedCelebrationSlot) return;
    const forcedSlides = baseSlides.filter(isCelebrationSlide).map(s => ({ url: s.url }));
    if (forcedSlides.length === 0) return;
    lastForcedCelebrationSlot = slot;
    forcedCelebrationActive = true;
    clearRotationTimers();
    pendingNextIdx = null;
    pendingReady = false;
    forcedCelebrationQueue = forcedSlides;
    playForcedCelebrationQueue();
  }

  /* ── Load channel config ───────────────────────────────────────────────── */
  async function loadConfig() {
    try {
      const res = await fetch(`${API_BASE}/api/channels/${channelId}`, {
        signal: AbortSignal.timeout(10000),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      statusDot.classList.remove('error');

      // Cache for offline resilience
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}

      return data;
    } catch (e) {
      console.error('[player] config fetch error:', e.message);
      statusDot.classList.add('error');

      // Try cached config
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          console.log('[player] using cached config');
          return JSON.parse(cached);
        }
      } catch (_) {}

      return null;
    }
  }

  /* ── Start rotation ────────────────────────────────────────────────────── */
  async function startRotation() {
    if (slides.length === 0) return;

    // Load first slide immediately
    currentIdx = 0;
    await loadSlide(activeFrame, slides[0].url);
    activeFrame.classList.add('visible');
    activeFrame.classList.remove('hidden');
    loading.classList.add('hidden');

    // If only one slide, no rotation needed
    if (slides.length <= 1) return;

    scheduleNext();
  }

  function scheduleNext() {
    if (forcedCelebrationActive) return;
    if (rotationTimer) clearTimeout(rotationTimer);
    if (preloadTimer) clearTimeout(preloadTimer);
    if (readinessTimer) clearTimeout(readinessTimer);

    const current = slides[currentIdx];
    const durationMs = (current.duration || 30) * 1000;

    // Pre-load next slide before transition
    const preloadMs = Math.max(0, durationMs - PRELOAD_SEC * 1000);
    preloadTimer = setTimeout(() => {
      const nextIdx = (currentIdx + 1) % slides.length;
      preloadNext(nextIdx);
    }, preloadMs);

    // Transition to next slide
    rotationTimer = setTimeout(() => {
      if (breakthroughActive) {
        // During breakthrough, retry in 5s instead of full duration
        rotationTimer = setTimeout(() => {
          if (breakthroughActive) { scheduleNext(); return; }
          attemptTransition(0);
        }, 5000);
        return;
      }
      attemptTransition(0);
    }, durationMs);
  }

  function preloadNext(nextIdx) {
    if (forcedCelebrationActive) return;
    pendingNextIdx = nextIdx;
    pendingReady = false;
    pendingToken += 1;
    const token = pendingToken;
    loadSlide(pendingFrame, slides[nextIdx].url).then(() => {
      if (token !== pendingToken) return;
      pendingReady = true;
    });
  }

  function attemptTransition(waitedMs) {
    if (forcedCelebrationActive) return;
    if (pendingReady && pendingNextIdx !== null) {
      transition();
      return;
    }
    if (waitedMs >= READY_WAIT_MS) {
      if (pendingNextIdx === null) {
        preloadNext((currentIdx + 1) % slides.length);
      }
      transition();
      return;
    }
    readinessTimer = setTimeout(() => {
      attemptTransition(waitedMs + READY_POLL_MS);
    }, READY_POLL_MS);
  }

  function transition() {
    if (forcedCelebrationActive) return;
    currentIdx = pendingNextIdx !== null ? pendingNextIdx : (currentIdx + 1) % slides.length;
    pendingNextIdx = null;
    pendingReady = false;

    // Crossfade
    activeFrame.classList.remove('visible');
    activeFrame.classList.add('hidden');
    pendingFrame.classList.remove('hidden');
    pendingFrame.classList.add('visible');

    // Swap references
    const tmp = activeFrame;
    activeFrame = pendingFrame;
    pendingFrame = tmp;

    scheduleNext();
  }

  function loadSlide(container, url) {
    clearFrame(container);
    const iframe = createIframe(url);
    container.appendChild(iframe);
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        resolve();
      };
      iframe.addEventListener('load', finish, { once: true });
      iframe.addEventListener('error', finish, { once: true });
      setTimeout(finish, PRELOAD_TIMEOUT_MS);
    });
  }

  /* ── Alert polling ─────────────────────────────────────────────────────── */
  async function pollAlerts() {
    try {
      const res = await fetch(`${API_BASE}/api/channels/${channelId}/alerts`, {
        signal: AbortSignal.timeout(8000),
      });
      if (!res.ok) return;
      const data = await res.json();

      // Breakthrough
      if (data.breakthrough) {
        showBreakthrough(data.breakthrough);
      } else {
        hideBreakthrough();
      }

      // Lightning
      if (data.lightning) {
        ltBanner.classList.add('active');
      } else {
        ltBanner.classList.remove('active');
      }
    } catch (e) {
      console.error('[player] alert poll error:', e.message);
    }
  }

  function showBreakthrough(bt) {
    const btSlide = document.getElementById('bt-slide');
    if (bt.slide_url) {
      // URL-based breakthrough: show as full-screen iframe
      btTitle.style.display = 'none';
      btMessage.style.display = 'none';
      document.getElementById('bt-pulse').style.display = 'none';
      btSlide.src = bt.slide_url;
      btSlide.style.display = 'block';
      btOverlay.style.background = 'transparent';
      btOverlay.style.padding = '0';
    } else {
      // Text-based breakthrough
      btSlide.style.display = 'none';
      btSlide.removeAttribute('src');
      btTitle.style.display = '';
      btMessage.style.display = '';
      document.getElementById('bt-pulse').style.display = '';
      btTitle.textContent = bt.title;
      btMessage.textContent = bt.message;
      btOverlay.style.background = bt.bg_color || '#D32F2F';
      btOverlay.style.color = bt.text_color || '#FFFFFF';
      btOverlay.style.padding = '60px';
    }
    btOverlay.classList.add('active');
    breakthroughActive = true;
  }

  function hideBreakthrough() {
    if (!breakthroughActive) return;
    const btSlide = document.getElementById('bt-slide');
    btSlide.style.display = 'none';
    btSlide.removeAttribute('src');
    btOverlay.classList.remove('active');
    breakthroughActive = false;
  }

  /* ── Heartbeat ─────────────────────────────────────────────────────────── */
  function sendHeartbeat() {
    fetch(`${API_BASE}/api/channels/${channelId}/heartbeat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    }).catch(() => {});
  }

  /* ── Config refresh (picks up slide changes without page reload) ────────── */
  async function refreshConfig() {
    const data = await loadConfig();
    if (!data || !data.slides || data.slides.length === 0) return;
    const nextRules = data.rules || {};
    const nextBaseSlides = data.slides;
    const oldJson = JSON.stringify({ slides: baseSlides, rules: channelRules });
    const newJson = JSON.stringify({ slides: nextBaseSlides, rules: nextRules });
    if (oldJson === newJson) return;

    console.log('[player] config changed, updating slides/rules');
    baseSlides = nextBaseSlides;
    channelRules = nextRules;
    slides = getEffectiveSlides(new Date());
    setTitle(data.name);

    // Restart rotation with updated slides
    currentIdx = 0;
    clearRotationTimers();
    if (forcedTimer) {
      clearTimeout(forcedTimer);
      forcedTimer = null;
    }
    forcedCelebrationActive = false;
    forcedCelebrationQueue = [];
    pendingNextIdx = null;
    pendingReady = false;
    await loadSlide(activeFrame, slides[0].url);
    if (slides.length > 1) scheduleNext();
  }

  /* ── Init ───────────────────────────────────────────────────────────────── */
  async function init() {
    loadText.textContent = `Loading ${channelId}…`;

    const data = await loadConfig();
    if (!data) {
      loadText.textContent = 'Channel not found. Check the URL and try again.';
      return;
    }

    if (!data.slides || data.slides.length === 0) {
      loadText.textContent = `Channel "${data.name}" has no slides configured.`;
      return;
    }

    baseSlides = data.slides;
    channelRules = data.rules || {};
    slides = getEffectiveSlides(new Date());
    setTitle(data.name);
    await startRotation();

    // Start polling for alerts
    pollAlerts();
    setInterval(pollAlerts, ALERT_POLL_MS);

    // Start heartbeat
    sendHeartbeat();
    setInterval(sendHeartbeat, HEARTBEAT_MS);

    // Periodically refresh config (picks up slide changes)
    setInterval(refreshConfig, CONFIG_POLL_MS);
    setInterval(() => {
      maybeApplyTimedSlides();
      maybeRunForcedCelebrations();
    }, TIMED_RULE_POLL_MS);
  }

  init();
})();
</script>
</body>
</html>
