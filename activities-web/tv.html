<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://activities-backend.onrender.com/api/schedule/tv">
  <title>Activities TV Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #FFF8F0;
      color: #3D3128;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #tv-page { display: flex; flex-direction: column; width: 100%; height: 100%; }

    /* ===== HEADLINE ===== */
    #tv-headline-wrap {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      border-bottom: 2px solid #E8D5C0;
    }

    #tv-headline {
      flex: 1;
      padding: 14px 20px 10px;
      font-size: clamp(26px, 3.2vw, 46px);
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 5px;
      color: #4A7A36;
      text-transform: uppercase;
    }

    /* Featured panel in header right — removed */

    /* ===== SCHEDULE BODY ===== */
    #tv-body {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #tv-schedule {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ===== SLIDESHOW ===== */
    #tv-slideshow {
      flex: 0 0 auto;
      width: clamp(120px, 15vw, 200px);
      height: clamp(80px, 9vw, 130px);
      background: #000;
      overflow: hidden;
      border-radius: 8px;
      position: relative;
    }

    .slideshow-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .slideshow-slide.active { opacity: 1; }

    /* ===== SCHEDULE AREA ===== */
    #tv-container {
      display: flex;
      flex-direction: row;
      flex: 1;
      padding: 6px 14px 4px;
      gap: 0;
      min-height: 0;
    }

    .tv-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 10px;
      border-right: 1px solid #E8D5C0;
      overflow: hidden;
    }
    .tv-col:last-child { border-right: none; }

    .tv-day-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .tv-day-name {
      font-size: clamp(13px, 1.3vw, 20px);
      font-weight: 700;
      color: #4A7A36;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .tv-date {
      font-size: clamp(10px, 0.85vw, 13px);
      color: #7A6B5A;
      font-weight: 500;
    }

    .tv-divider {
      height: 2px;
      background: #E37433;
      margin-bottom: 8px;
      opacity: 0.6;
    }

    .tv-show-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .tv-show-item {
      font-size: clamp(13px, 1.2vw, 18px);
      line-height: 1.4;
      color: #3D3128;
    }

    .tv-show-time {
      font-weight: 700;
      color: #E37433;
      display: inline;
    }
    .tv-show-time::after { content: ' \00B7 '; font-weight: 400; color: #B8A898; }

    .tv-show-title { display: block; color: #4A7A36; font-weight: 700; }
    .tv-show-title.canceled { color: #9ca3af; font-weight: 400; font-family: 'Inter', sans-serif; }

    .tv-canceled-note {
      display: block;
      font-size: clamp(10px, 0.9vw, 13px);
      font-weight: 500;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tv-relocated-venue {
      display: block;
      font-size: clamp(10px, 0.9vw, 13px);
      font-weight: 700;
      color: #C0392B;
    }

    .tv-relocated-note {
      display: block;
      font-size: clamp(9px, 0.8vw, 12px);
      color: #C0392B;
      font-style: italic;
    }

    .tv-rescheduled-note {
      display: block;
      font-size: clamp(9px, 0.8vw, 12px);
      font-weight: 700;
      color: #B9770E;
    }

    .tv-empty {
      font-size: clamp(14px, 1.4vw, 20px);
      color: #B8A898;
      font-style: italic;
    }

    /* ===== BOTTOM BAR ===== */
    #tv-bottom {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 8px;
      border-top: 2px solid #E8D5C0;
      gap: 12px;
    }

    /* Left gutter: QR code */
    #tv-qr {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    #tv-qr img {
      width: clamp(80px, 9vw, 130px);
      height: clamp(80px, 9vw, 130px);
      border-radius: 6px;
      background: #fff;
      padding: 4px;
    }

    #tv-qr-text {
      font-size: clamp(10px, 1vw, 14px);
      color: #3D3128;
      line-height: 1.5;
      max-width: 280px;
    }

    /* Right: sports info */
    #tv-sports {
      text-align: right;
      font-size: clamp(11px, 1.1vw, 16px);
      color: #3D3128;
      line-height: 1.5;
    }

    #tv-sports .sports-headline {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 1.35vw, 20px);
      color: #4A7A36;
      letter-spacing: 1px;
    }

    /* ===== STATUS ===== */
    #tv-status {
      position: fixed;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(9px, 0.8vw, 12px);
      color: #B8A898;
    }

    #tv-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      font-size: 30px;
      color: #7A6B5A;
    }
  </style>
</head>
<body>
  <div id="tv-page">

    <div id="tv-headline-wrap">
      <div id="tv-headline">🏄 Activities Schedule</div>
    </div>

    <div id="tv-body">
      <div id="tv-schedule">
        <div id="tv-loading">Loading schedule…</div>
        <div id="tv-container" style="display:none;"></div>
      </div>
    </div>

    <div id="tv-bottom">
      <!-- Left gutter: QR code + text -->
      <div id="tv-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fccbractivix.github.io%2FRGP%2Factivities-web%2Findex.html"
             alt="QR Code for activities schedule">
        <div id="tv-qr-text">
          See the full activities schedule for the whole week at our website by either scanning the QR code
          or by using the shortcut <strong>rocketbeachresort.com</strong>.
        </div>
      </div>
      <!-- Center: slideshow -->
      <div id="tv-slideshow"></div>
      <!-- Right: sports info -->
      <div id="tv-sports">
        <div class="sports-headline">Dawn to Dusk</div>
        <div>Basketball, Volleyball, Pickleball and More!</div>
        <div>All supplies available for rental at the Front Desk.</div>
      </div>
    </div>

  </div>

  <div id="tv-status"></div>
  <script src="tv.js"></script>
</body>
</html>
