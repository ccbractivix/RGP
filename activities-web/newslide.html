<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://activities-backend.onrender.com/api/schedule">
  <title>Activities Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #163246;
      --muted: #516f82;
      --accent: #0f5e84;
      --panel-bg: rgba(255, 255, 255, 0.74);
      --panel-border: rgba(255, 255, 255, 0.58);
      --shadow: 0 20px 45px rgba(14, 41, 61, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #081521;
      color: var(--text);
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-canvas {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      background: url('../static/images/HICV_ACTIVIX_base.jpg') center center / cover no-repeat;
      overflow: hidden;
    }

    .schedule-box {
      position: absolute;
      display: flex;
      flex-direction: column;
      padding: 2.1% 2%;
      border-radius: 30px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    #today-box {
      left: 2.083%;
      top: 10.833%;
      width: 32.188%;
      height: 85.648%;
    }

    #upcoming-box {
      position: absolute;
      left: 48.95%;
      top: 73.45%;
      width: 47.2%;
      height: 22.8%;
    }

    .box-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 2px solid rgba(15, 94, 132, 0.14);
    }

    .box-title {
      margin: 0;
      font-size: clamp(22px, 1.9vw, 38px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .box-subtitle {
      font-size: clamp(14px, 1.15vw, 20px);
      font-weight: 600;
      color: var(--muted);
      text-align: right;
    }

    #today-box .box-title {
      font-size: clamp(15px, 1.33vw, 27px);
    }

    #today-box .box-subtitle {
      font-size: clamp(10px, 0.8vw, 14px);
    }

    #today-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    #today-portal {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(15, 94, 132, 0.16);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    #today-qr {
      width: clamp(66px, 5vw, 108px);
      height: clamp(66px, 5vw, 108px);
      flex: 0 0 auto;
      padding: 4px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid rgba(15, 94, 132, 0.2);
      object-fit: contain;
    }

    #today-portal-text {
      font-size: clamp(9px, 0.62vw, 12px);
      line-height: 1.25;
      font-weight: 600;
      color: var(--muted);
    }

    .today-row {
      display: grid;
      grid-template-columns: minmax(98px, 22%) 1fr;
      gap: 16px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid rgba(15, 94, 132, 0.12);
    }

    .today-row:last-child { border-bottom: none; }

    .time-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 8px 12px;
      border-radius: 16px;
      background: rgba(15, 94, 132, 0.1);
      color: var(--accent);
      font-size: clamp(18px, 1.35vw, 28px);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
    }

    #today-box .time-pill {
      font-size: clamp(13px, 0.95vw, 20px);
    }

    .activity-name {
      font-size: clamp(20px, 1.5vw, 31px);
      font-weight: 800;
      line-height: 1.12;
      color: #12354a;
    }

    #today-box .activity-name {
      font-size: clamp(14px, 1.05vw, 22px);
    }

    .activity-detail {
      margin-top: 4px;
      font-size: clamp(14px, 1vw, 20px);
      line-height: 1.25;
      color: var(--muted);
      font-weight: 600;
    }

    #today-box .activity-detail {
      font-size: clamp(10px, 0.7vw, 14px);
    }

    .activity-name.canceled,
    .activity-detail.canceled {
      color: #818f99;
    }

    .activity-detail.relocated {
      color: #b63e2f;
    }

    #upcoming-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      height: 100%;
    }

    .day-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(15, 94, 132, 0.1);
    }

    .day-name {
      font-size: clamp(16px, 1.15vw, 23px);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
    }

    #upcoming-box .box-title {
      font-size: clamp(11px, 0.95vw, 19px);
    }

    #upcoming-box .day-name {
      font-size: clamp(8px, 0.575vw, 12px);
    }

    .day-date {
      margin-top: 3px;
      font-size: clamp(12px, 0.9vw, 16px);
      font-weight: 700;
      color: var(--muted);
    }

    #upcoming-box .day-date {
      font-size: clamp(6px, 0.45vw, 8px);
    }

    .day-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .day-item {
      padding-top: 8px;
      border-top: 1px solid rgba(15, 94, 132, 0.1);
    }

    .day-item:first-child {
      padding-top: 0;
      border-top: none;
    }

    .day-time {
      font-size: clamp(12px, 0.95vw, 17px);
      font-weight: 800;
      color: var(--accent);
      line-height: 1.15;
    }

    #upcoming-box .day-time {
      font-size: clamp(6px, 0.475vw, 9px);
    }

    .day-activity {
      margin-top: 2px;
      font-size: clamp(13px, 1vw, 18px);
      font-weight: 700;
      line-height: 1.2;
      color: #12354a;
    }

    #upcoming-box .day-activity {
      font-size: clamp(7px, 0.5vw, 9px);
    }

    .day-note {
      margin-top: 2px;
      font-size: clamp(11px, 0.8vw, 14px);
      font-weight: 600;
      line-height: 1.2;
      color: var(--muted);
    }

    #upcoming-box .day-note {
      font-size: clamp(6px, 0.4vw, 7px);
    }

    .day-activity.canceled,
    .day-note.canceled {
      color: #818f99;
    }

    .day-note.relocated {
      color: #b63e2f;
    }

    .empty-state {
      margin: auto 0;
      text-align: center;
      font-size: clamp(18px, 1.4vw, 28px);
      font-weight: 700;
      color: var(--muted);
    }

    #today-box .empty-state {
      font-size: clamp(13px, 0.98vw, 20px);
    }

    #upcoming-box .empty-state {
      font-size: clamp(9px, 0.7vw, 14px);
    }

    #status {
      position: absolute;
      right: 1.6%;
      bottom: 1.2%;
      font-size: clamp(11px, 0.8vw, 15px);
      font-weight: 600;
      color: rgba(10, 31, 44, 0.6);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="slide-shell">
    <div class="slide-canvas">
      <section id="today-box" class="schedule-box">
        <div class="box-header">
          <h1 class="box-title">Today</h1>
          <div id="today-label" class="box-subtitle"></div>
        </div>
        <div id="today-list">
          <div class="empty-state">Loading today&apos;s schedule…</div>
        </div>
        <div id="today-portal">
          <img
            id="today-qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fsites.google.com%2Fview%2Fholidayinnclubcape%2Fhome"
            alt="QR code to Resort Guest Portal website"
          >
          <div id="today-portal-text">See our Resort Guest Portal website for the full week&apos;s activities schedule, movie theater listings, rocket launch info, things to do in the area, and a whole lot more!</div>
        </div>
      </section>

      <section id="upcoming-box">
      
        <div id="upcoming-grid"></div>
      </section>

      <div id="status"></div>
    </div>
  </div>

  <script src="newslide.js"></script>
</body>
</html>
