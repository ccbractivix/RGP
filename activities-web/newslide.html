<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-url" content="https://activities-backend.onrender.com/api/schedule">
  <title>Activities Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #454040;
      --muted: #454040;
      --accent: #E6744A;
      --panel-bg: rgba(255, 255, 255, 0.74);
      --panel-border: rgba(255, 255, 255, 0.58);
      --shadow: 0 20px 45px rgba(14, 41, 61, 0.18);
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #081521;
      color: var(--text);
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-canvas {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      background: url('../static/images/HICV_ACTIVIX_blank.jpg') center center / cover no-repeat;
      overflow: hidden;
    }

    .schedule-box {
      position: absolute;
      display: flex;
      flex-direction: column;
      padding: 2.1% 2%;
      border-radius: 30px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      overflow: hidden;
    }

    #today-box {
      left: 2.083%;
      top: 6.5%;
      width: 32.188%;
      height: 89.981%;
    }

    #promo-bubbles {
      position: absolute;
      left: 37.2%;
      top: 55.4%;
      width: 59.1%;
      height: 39.7%;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 1.8%;
    }

    .promo-bubble {
      flex: 1 1 0;
      min-width: 0;
      border-radius: 30px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 7% 5%;
    }

    .promo-bubble-text {
      font-size: clamp(11px, 1.4vw, 28px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: var(--text);
      text-transform: uppercase;
      overflow-wrap: break-word;
    }

    .box-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 2px solid rgba(15, 94, 132, 0.14);
    }

    .box-title {
      margin: 0;
      font-size: clamp(11px, 1.9vw, 38px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      overflow-wrap: break-word;
    }

    .box-subtitle {
      font-size: clamp(7px, 1.15vw, 20px);
      font-weight: 600;
      color: var(--muted);
      text-align: right;
      overflow-wrap: break-word;
    }

    #today-box .box-title {
      font-size: clamp(8px, 1.33vw, 27px);
    }

    #today-box .box-subtitle {
      font-size: clamp(5px, 0.8vw, 14px);
    }

    #today-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .today-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid rgba(15, 94, 132, 0.12);
    }

    .today-row:last-child { border-bottom: none; }

    .today-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      width: 100%;
    }

    .time-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(15, 94, 132, 0.1);
      color: var(--accent);
      font-size: clamp(8px, 1.1vw, 22px);
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    #today-box .time-pill {
      font-size: clamp(6px, 0.85vw, 17px);
    }

    .activity-name {
      font-size: clamp(10px, 1.5vw, 31px);
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
      overflow-wrap: break-word;
    }

    #today-box .activity-name {
      font-size: clamp(7px, 1.05vw, 22px);
    }

    .activity-detail {
      margin-left: 2px;
      font-size: clamp(7px, 1vw, 20px);
      line-height: 1.25;
      color: var(--muted);
      font-weight: 600;
      overflow-wrap: break-word;
    }

    #today-box .activity-detail {
      font-size: clamp(5px, 0.7vw, 14px);
    }

    .activity-name.canceled,
    .activity-detail.canceled {
      color: #818f99;
    }

    .activity-detail.relocated {
      color: #b63e2f;
    }

    #upcoming-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: start;
      gap: 0.85%;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .day-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0 4% 0 0;
      border-radius: 0;
      background: transparent;
      border: none;
    }

    .day-header {
      display: flex;
      align-items: baseline;
      gap: 3px;
      flex-wrap: wrap;
    }

    .day-name {
      font-size: clamp(8px, 1.15vw, 23px);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      overflow-wrap: break-word;
    }

    #upcoming-box .box-title {
      font-size: clamp(10px, 1.615vw, 32px);
    }

    #upcoming-box .day-name {
      font-size: clamp(9px, 1.054vw, 22px);
    }

    .day-date {
      margin-top: 0;
      font-size: clamp(6px, 0.9vw, 16px);
      font-weight: 700;
      color: var(--muted);
      overflow-wrap: break-word;
    }

    #upcoming-box .day-date {
      font-size: clamp(3px, 0.408vw, 9px);
    }

    .day-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      overflow: hidden;
    }

    .day-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .day-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .day-time {
      font-size: clamp(6px, 0.95vw, 17px);
      font-weight: 800;
      color: var(--accent);
      line-height: 1.15;
      white-space: nowrap;
    }

    #upcoming-box .day-time {
      font-size: clamp(3px, 0.51vw, 10px);
    }

    .day-activity {
      font-size: clamp(7px, 1vw, 18px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      min-width: 0;
      overflow-wrap: break-word;
    }

    #upcoming-box .day-activity {
      font-size: clamp(3px, 0.51vw, 10px);
    }

    .day-note {
      margin-top: 2px;
      font-size: clamp(6px, 0.8vw, 14px);
      font-weight: 600;
      line-height: 1.2;
      color: var(--muted);
      overflow-wrap: break-word;
    }

    #upcoming-box .day-note {
      font-size: clamp(5px, 0.748vw, 14px);
    }

    .day-activity.canceled,
    .day-note.canceled {
      color: #818f99;
    }

    .day-note.relocated {
      color: #b63e2f;
    }

    #upcoming-footer {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 6px;
      margin-top: auto;
      padding-top: 1%;
      border-top: 1px solid rgba(230, 116, 74, 0.25);
    }

    #upcoming-qr {
      width: clamp(48px, 3.6vw, 78px);
      height: clamp(48px, 3.6vw, 78px);
      flex: 0 0 auto;
      padding: 4px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid rgba(230, 116, 74, 0.3);
      object-fit: contain;
    }

    #upcoming-portal-text {
      flex: 0 1 auto;
      font-size: clamp(6px, 0.84vw, 16px);
      line-height: 1.25;
      font-weight: 600;
      color: var(--text);
      text-align: left;
      overflow-wrap: break-word;
    }

    .empty-state {
      margin: auto 0;
      text-align: center;
      font-size: clamp(9px, 1.4vw, 28px);
      font-weight: 700;
      color: var(--muted);
    }

    #today-box .empty-state {
      font-size: clamp(7px, 0.98vw, 20px);
    }

    #upcoming-box .empty-state {
      font-size: clamp(9px, 1.19vw, 24px);
    }

    #status {
      position: absolute;
      right: 1.6%;
      bottom: 1.2%;
      font-size: clamp(6px, 0.8vw, 15px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="slide-shell">
    <div class="slide-canvas">
      <section id="today-box" class="schedule-box">
        <div class="box-header">
          <h1 class="box-title">TODAY'S ACTIVITIES</h1>
          <div id="today-label" class="box-subtitle"></div>
        </div>
        <div id="today-list">
          <div class="empty-state">Loading today&apos;s schedule…</div>
        </div>
      </section>

      <section id="promo-bubbles" aria-label="Upcoming activities highlights">
        <article class="promo-bubble">
          <div class="promo-bubble-text">Pool Party Thursday 3 PM</div>
        </article>
        <article class="promo-bubble">
          <div class="promo-bubble-text">CASH BINGO</div>
        </article>
        <article class="promo-bubble">
          <div class="promo-bubble-text"></div>
        </article>
      </section>

      <div id="status"></div>
    </div>
  </div>

  <script src="newslide.js"></script>
</body>
</html>
